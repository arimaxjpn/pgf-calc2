<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PGF Calc 2</title>
<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#222222">
<!-- iOS PWA -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PGF Calc 2">
<style>
  /* --- Reset & Base --- */
  body {
    background-color: #000;
    color: #e8e8e8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0;
    padding: 15px 10px;
    text-align: center;
    box-sizing: border-box;
    overscroll-behavior: none;
  }
  *, *:before, *:after { box-sizing: inherit; }

  /* --- Inputs --- */
  /* 入力欄の見た目はここが唯一の出所。個別に色を上書きしない */
  input {
    font-size: 16px !important;
    font-weight: bold;
    text-align: center;
    background: #2b2b2b;
    color: #e8e8e8;
    border: 1px solid #4a4a4a;
    border-radius: 6px;
    width: 100%;
    height: 34px;
    -webkit-appearance: none;
    margin: 0;
  }
  input:focus { outline: none; }
  input::placeholder { color: #6b6b6b; font-weight: normal; }
  /* Remove number input spinners globally */
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }

  /* --- Layout Components --- */
  .row { display: flex; width: 100%; gap: 0; }
  .panel {
    background: #222;
    border: 1px solid #333;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    margin: -1px 0 0 -1px; /* Border collapse hack */
    position: relative;
    padding: 4px;
  }
  
  /* --- Colors --- */

  /* --- Main Grid (Scrollable) --- */
  .grid-wrapper {
    position: relative;
    border: 1px solid #333;
    border-radius: 10px;
    overflow: hidden; /* Contains the scroll */
    background: #222;
  }
  .scroll-container {
    display: grid;
    /* 列の指定は generateGrid() が SPANS と COL_W から設定する（二重管理を避けるため） */
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    max-width: 100%;
  }
  /* Grid Items */
  .cell-h { height: 68px; } /* Data row height */

  /* --- Input Group (Result + Input + Diff) --- */
  /* 目標値（計算で出した狙いの読値）。答えではないので控えめに */
  .res-line { line-height: 1.3; display: block; min-height: 22px; font-size: 13px; padding: 2px 0; color: #6b6b6b; font-weight: normal; }
  .inp-group { position: relative; width: 100%; margin: 2px 0; }
  .inp-sm { height: 34px; font-size: 16px !important; padding-right: 28px; }
  .btn-clear {
    position: absolute; right: 0; top: 0; height: 34px; width: 28px;
    background: transparent; border: none; color: #9a9a9a; font-size: 24px;
    font-weight: bold; cursor: pointer; display: none; align-items: center; justify-content: center;
    line-height: 34px; padding: 0;
  }
  .btn-clear.show {
    display: flex;
  }
  /* 差分＝このアプリの答え（高い／低い／OK）。画面で最も強い印はここに乗せる */
  .diff-line {
    display: block; min-height: 22px; white-space: nowrap;
    font-size: 15px; font-weight: 800; padding: 2px 0; letter-spacing: 0.02em;
  }

  /* --- Slope / Distance inputs: dark theme --- */
  /* 勾配・距離は道路に沿った一続きの帯として見せる。色は土台のまま、角と境だけ落とす */
  .int-slope-inp input,
  .int-dist-cell input {
    border-radius: 0;
    border-right: none;
  }
  .int-slope-inp input:focus,
  .int-dist-cell input:focus { outline: none; }

  /* --- Integrated Section (Slope + SVG + Distances) --- */
  .int-cell {
    grid-column: 1 / -1;
    display: flex;
    flex-direction: column;
    background: #222;
    border-top: 1px solid #333;
    border-bottom: 1px solid #333;
  }
  .int-top {
    display: flex;
    align-items: center;
    padding: 20px 0 0 0;
  }
  .int-slope-inp {
    width: 100px;
    padding: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .int-bottom {
    display: flex;
    padding-bottom: 2px;
  }
  .int-dist-cell {
    width: 100px;
    min-width: 100px;
    height: 34px;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }

  /* --- Footer Buttons --- */
  .footer { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr); gap: 8px; margin-top: 15px; height: 50px; }

  /* --- Formula Display --- */
  .formula {
    margin-top: 15px;
    padding: 10px 14px;
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 6px;
    text-align: left;
    font-size: 11px;
    color: #6b6b6b;
    line-height: 1.8;
  }
  .formula span { color: #9a9a9a; }
  .btn {
    border: none; border-radius: 8px;
    font-weight: bold; font-size: 14px; color: #e8e8e8; cursor: pointer;
  }
  .btn-reset { background: #3f3f3f; color: #e8e8e8; }
  .btn-flip { background: #3f3f3f; }
  .btn-corr { background: #3f3f3f; color: #e8e8e8; }
  .btn-corr-on  { background: #E65100; color: #e8e8e8; }
  .btn-corr-off { background: #3f3f3f; color: #9a9a9a; }
  .corr-wrap { position: relative; height: 50px; }
  .corr-wrap .btn { width: 100%; height: 100%; }
  .corr-inp {
    position: absolute;
    left: 0; top: 0; right: 0; bottom: 0;
    width: auto; height: 50px;
    font-size: 16px !important; font-weight: bold;
    text-align: center; background: #2b2b2b; color: #e8e8e8;
    border: 1px solid #4a4a4a; border-radius: 8px;
    padding: 0; -webkit-appearance: none; margin: 0;
  }
  .corr-inp.has-action {
    right: 44px;
    border-right: none;
    border-top-right-radius: 0;
    border-bottom-right-radius: 0;
  }
  .corr-inp::placeholder { color: #6b6b6b; font-weight: normal; }
  .corr-inp:focus { outline: none; }
  .btn-corr-action {
    position: absolute; right: 0; top: 0; height: 50px; width: 44px;
    border: 1px solid #4a4a4a; border-left: none; border-radius: 0 8px 8px 0;
    font-size: 13px; font-weight: bold; cursor: pointer; color: #e8e8e8;
  }


  /* --- Slope Calculator (勾配計算) --- */
  .sc-bar { margin-top: 15px; }
  .sc-bar .btn { width: 100%; height: 44px; }
  .btn-sc { background: #3f3f3f; color: #e8e8e8; }
  .btn-sc-on { background: #1565C0; color: #e8e8e8; }
  .sc-panel {
    margin-top: 8px; padding: 10px;
    background: #1a1a1a; border: 1px solid #333; border-radius: 8px;
  }
  .sc-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .sc-row:last-child { margin-bottom: 0; }
  .sc-label { width: 44px; min-width: 44px; font-size: 11px; color: #9a9a9a; line-height: 1.3; text-align: center; }
  .sc-sub { color: #6b6b6b; }
  .sc-inp {
    flex: 1; min-width: 0; height: 40px;
    font-size: 16px !important; font-weight: bold; text-align: center;
    background: #2b2b2b; color: #e8e8e8;
    border: 1px solid #4a4a4a; border-radius: 6px;
    padding: 0; -webkit-appearance: none; margin: 0;
  }
  .sc-inp::placeholder { color: #6b6b6b; font-weight: normal; }
  .sc-inp:focus { outline: none; }
  .sc-result {
    flex: 1; min-width: 0; height: 40px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: bold; color: #6b6b6b;
    background: #222; border: 1px solid #333; border-radius: 6px;
  }
  .sc-apply, .sc-close {
    flex: 1; min-width: 0; height: 40px;
    border: none; border-radius: 6px;
    font-size: 14px; font-weight: bold; cursor: pointer;
  }
  .sc-apply { background: #1565C0; color: #e8e8e8; }
  .sc-apply:disabled { background: #2b2b2b; color: #6b6b6b; }
  .sc-close { background: #3f3f3f; color: #e8e8e8; }
  /* 勾配計算の測距が指す範囲の印。黄＝収まっている／赤＝最後の半端な1本。
     入力欄が親の背景を覆うため、印は入力欄そのものに掛ける。
     枠線ではなく inset の影を使うのは、大きさが変わらず配置を崩さないため。 */
  .int-slope-inp.mark-ok  input { background: #3a3520; box-shadow: inset 0 2px 0 #FFD600, inset 0 -2px 0 #FFD600; }
  .int-slope-inp.mark-bad input { background: #3a2320; box-shadow: inset 0 2px 0 #f44336, inset 0 -2px 0 #f44336; }
  .int-slope-inp.mark-ok.mark-l input        { box-shadow: inset 0 2px 0 #FFD600, inset 0 -2px 0 #FFD600, inset 2px 0 0 #FFD600; }
  .int-slope-inp.mark-ok.mark-r input        { box-shadow: inset 0 2px 0 #FFD600, inset 0 -2px 0 #FFD600, inset -2px 0 0 #FFD600; }
  .int-slope-inp.mark-ok.mark-l.mark-r input { box-shadow: inset 0 2px 0 #FFD600, inset 0 -2px 0 #FFD600, inset 2px 0 0 #FFD600, inset -2px 0 0 #FFD600; }
  .int-slope-inp.mark-bad.mark-l input        { box-shadow: inset 0 2px 0 #f44336, inset 0 -2px 0 #f44336, inset 2px 0 0 #f44336; }
  .int-slope-inp.mark-bad.mark-r input        { box-shadow: inset 0 2px 0 #f44336, inset 0 -2px 0 #f44336, inset -2px 0 0 #f44336; }
  .int-slope-inp.mark-bad.mark-l.mark-r input { box-shadow: inset 0 2px 0 #f44336, inset 0 -2px 0 #f44336, inset 2px 0 0 #f44336, inset -2px 0 0 #f44336; }
</style>
</head>
<body>

  <div class="sc-bar">
    <button id="sc-btn" class="btn btn-sc" onclick="toggleSlopeCalc()">勾配計算</button>
  </div>
  <div id="sc-panel" class="sc-panel" style="display:none">
    <div class="sc-row">
      <span class="sc-label">読値A<br><span class="sc-sub">手前</span></span>
      <input type="text" inputmode="decimal" id="sc_a" class="sc-inp" placeholder="mm" oninput="onSlopeCalcInput()" onkeydown="chkEnt(event)">
      <span class="sc-label">読値B<br><span class="sc-sub">先</span></span>
      <input type="text" inputmode="decimal" id="sc_b" class="sc-inp" placeholder="mm" oninput="onSlopeCalcInput()" onkeydown="chkEnt(event)">
    </div>
    <div class="sc-row">
      <span class="sc-label">測距<br><span class="sc-sub">(m)</span></span>
      <input type="text" inputmode="decimal" id="sc_d" class="sc-inp" placeholder="m" oninput="onSlopeCalcInput()" onkeydown="chkEnt(event)">
    </div>
    <div class="sc-row">
      <span class="sc-result" id="sc_out">読値A・読値B・測距を入れる</span>
    </div>
    <div class="sc-row">
      <button class="sc-apply" id="sc_apply" onclick="applySlopeCalc()" disabled>適用</button>
      <button class="sc-close" onclick="toggleSlopeCalc()">閉じる</button>
    </div>
  </div>

  <div class="grid-wrapper">
    <div class="scroll-container" id="mainGrid">
      </div>
  </div>

  <div class="footer">
    <div class="corr-wrap">
      <button id="corr-btn" class="btn btn-corr" onclick="showCorrInput()">補正値</button>
      <input type="text" inputmode="decimal" id="val_corr" class="corr-inp" placeholder="" style="display:none"
        oninput="onCorrInput()" onblur="onCorrBlur()" onkeydown="chkEnt(event)">
      <button id="corr-action-btn" class="btn-corr-action btn-corr-on" style="display:none" onclick="toggleCorr()">ON</button>
    </div>
    <button class="btn btn-reset" onclick="doReset()">読値リセット</button>
    <button class="btn btn-flip" onclick="doFlip()">観測点変更</button>
  </div>
  <div class="formula">
    <span>累積落差 (mm)</span>　＝　距離 (m) × 勾配 (%) × 10　　※スパンごとに加算<br>
    <span>目標値</span>　＝　基準読み値 − 累積落差　（＋ 補正値　補正ON時）<br>
    <span>差分</span>　＝　目標値 − 実測値　　( + → 高い　/ − → 低い )
  </div>

<script>
/* --- Logic --- */

// Configuration
const SPANS = 6; // スパン数（PGF製品の本数）
const COL_W = 100; // 1列の幅(px)。グリッドの列幅・SVG幅・点の間隔すべての出所
// PGF製品1本の標準長(m)。現場に例外があればスパンごとの距離欄で手動変更する（既存の運用）
const SPAN_LEN_M = 5;
let isReversed = false; // Observation point direction: false = 上り側から, true = 下り側から
let corrOn = false; // Correction ON/OFF state

// Initialize
window.onload = function() {
  generateGrid();
  runCalc();
};

function chkEnt(e) {
  if (e.key === 'Enter' || e.keyCode === 13) e.target.blur();
}

function generateGrid() {
  const grid = document.getElementById('mainGrid');
  const wrapper = document.querySelector('.grid-wrapper');
  
  // Update wrapper class for reversed layout
  if (isReversed) {
    wrapper.classList.add('reversed');
  } else {
    wrapper.classList.remove('reversed');
  }
  
  // 列指定は SPANS と COL_W から作る。基準点1列＋スパンSPANS列
  const colSpec = isReversed
    ? `repeat(${SPANS}, ${COL_W}px) ${COL_W}px`
    : `${COL_W}px repeat(${SPANS}, ${COL_W}px)`;
  grid.style.gridTemplateColumns = colSpec;

  let html = '';
  
  // Determine column order based on observation direction
  const spanOrder = isReversed ? Array.from({length: SPANS}, (_, i) => SPANS - i) : Array.from({length: SPANS}, (_, i) => i + 1);

  // 1. Integrated section (settings): slope inputs (top) + SVG (middle) + distances (bottom)
  // Cascade rule: slope entered at span i applies to span i and all subsequent spans
  let slopeCellsHtml = '';
  for (let k = 0; k < spanOrder.length; k++) {
    const idx = spanOrder[k];
    slopeCellsHtml += `<div class="int-slope-inp">
      <div class="inp-group">
        <input type="number" id="val_slope_${idx}" class="inp-sm" placeholder="−" step="0.1" oninput="onSlopeInput(${idx})" onkeydown="chkEnt(event)">
        <button class="btn-clear" onclick="clearSlope(${idx})">×</button>
      </div>
    </div>`;
  }
  // 50px label spacer: centered on reference dot, label text identifies the row
  const slopeSpacer = `<div style="width:50px;min-width:50px;height:34px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;"><span style="font-size:10px;color:#9a9a9a;line-height:1.3;">勾配<br>(%)</span></div>`;
  const distSpacer  = `<div style="width:50px;min-width:50px;height:34px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;"><span style="font-size:10px;color:#9a9a9a;line-height:1.3;">距離<br>(m)</span></div>`;

  html += `<div class="int-cell">
    <div class="int-top">${slopeSpacer}${slopeCellsHtml}</div>
    <div class="int-bottom">${distSpacer}`;
  for(let idx of spanOrder) {
    html += `<div class="int-dist-cell">
        <div class="inp-group">
          <input type="number" id="in_dist_${idx}" class="inp-sm" placeholder="${SPAN_LEN_M}" oninput="onDistInput(${idx})" onkeydown="chkEnt(event)">
          <button class="btn-clear" onclick="clearDist(${idx})">×</button>
        </div>
      </div>`;
  }
  html += `</div>
    <svg id="slope-svg" width="${(SPANS + 1) * COL_W}" height="90" style="display:block"></svg>
    </div>`;

  // 2. Back Row (奥) - readings
  if (isReversed) {
    for(let idx of spanOrder) {
      html += `
        <div class="panel cell-h">
          <div class="inp-group">
            <input type="number" id="in_rb_${idx}" class="inp-sm" placeholder="読値" oninput="chkDiff('rb', ${idx})" onkeydown="chkEnt(event)">
            <button class="btn-clear" onclick="clearInp('in_rb_${idx}')">×</button>
          </div>
          <div style="display:flex;width:100%;justify-content:space-between;align-items:center;height:26px;">
            <span id="out_rb_${idx}" class="res-line">-</span>
            <span id="diff_rb_${idx}" class="diff-line" style="color:#6b6b6b">-</span>
          </div>
        </div>`;
    }
    html += `<div class="panel cell-h"><input type="number" id="val_rb" class="inp-sm" placeholder="読値" oninput="runCalc()" onkeydown="chkEnt(event)"><div style="height:26px;width:100%"></div></div>`;
  } else {
    html += `<div class="panel cell-h"><input type="number" id="val_rb" class="inp-sm" placeholder="読値" oninput="runCalc()" onkeydown="chkEnt(event)"><div style="height:26px;width:100%"></div></div>`;
    for(let idx of spanOrder) {
      html += `
        <div class="panel cell-h">
          <div class="inp-group">
            <input type="number" id="in_rb_${idx}" class="inp-sm" placeholder="読値" oninput="chkDiff('rb', ${idx})" onkeydown="chkEnt(event)">
            <button class="btn-clear" onclick="clearInp('in_rb_${idx}')">×</button>
          </div>
          <div style="display:flex;width:100%;justify-content:space-between;align-items:center;height:26px;">
            <span id="out_rb_${idx}" class="res-line">-</span>
            <span id="diff_rb_${idx}" class="diff-line" style="color:#6b6b6b">-</span>
          </div>
        </div>`;
    }
  }

  // 3. Front Row (手前) - readings
  if (isReversed) {
    for(let idx of spanOrder) {
      html += `
        <div class="panel cell-h">
          <div class="inp-group">
            <input type="number" id="in_rf_${idx}" class="inp-sm" placeholder="読値" oninput="chkDiff('rf', ${idx})" onkeydown="chkEnt(event)">
            <button class="btn-clear" onclick="clearInp('in_rf_${idx}')">×</button>
          </div>
          <div style="display:flex;width:100%;justify-content:space-between;align-items:center;height:26px;">
            <span id="out_rf_${idx}" class="res-line">-</span>
            <span id="diff_rf_${idx}" class="diff-line" style="color:#6b6b6b">-</span>
          </div>
        </div>`;
    }
    html += `<div class="panel cell-h"><input type="number" id="val_rf" class="inp-sm" placeholder="読値" oninput="runCalc()" onkeydown="chkEnt(event)"><div style="height:26px;width:100%"></div></div>`;
  } else {
    html += `<div class="panel cell-h"><input type="number" id="val_rf" class="inp-sm" placeholder="読値" oninput="runCalc()" onkeydown="chkEnt(event)"><div style="height:26px;width:100%"></div></div>`;
    for(let idx of spanOrder) {
      html += `
        <div class="panel cell-h">
          <div class="inp-group">
            <input type="number" id="in_rf_${idx}" class="inp-sm" placeholder="読値" oninput="chkDiff('rf', ${idx})" onkeydown="chkEnt(event)">
            <button class="btn-clear" onclick="clearInp('in_rf_${idx}')">×</button>
          </div>
          <div style="display:flex;width:100%;justify-content:space-between;align-items:center;height:26px;">
            <span id="out_rf_${idx}" class="res-line">-</span>
            <span id="diff_rf_${idx}" class="diff-line" style="color:#6b6b6b">-</span>
          </div>
        </div>`;
    }
  }

  grid.innerHTML = html;
}

// Cascade: slope entered at span i applies to i and all subsequent spans (1→4 order)
// 各スパンの勾配(%)。未入力は null を返す。
// 引き継ぎ（カスケード）はしない——測っていない区間に目標値を出さないため。
// 0% は「水平」という有効な値なので、未入力と 0 は区別する必要がある。
function getSpanSlopes() {
  const out = [];
  for (let i = 1; i <= SPANS; i++) {
    const el = document.getElementById(`val_slope_${i}`);
    const raw = el ? el.value.trim() : '';
    const v = raw === '' ? null : parseFloat(raw);
    out.push(Number.isFinite(v) ? v : null);
  }
  return out;
}

// スパン i の距離(m)。未入力は SPAN_LEN_M
function spanLen(i) {
  const el = document.getElementById(`in_dist_${i}`);
  const v = (el && el.value.trim() !== '') ? parseFloat(el.value) : SPAN_LEN_M;
  return Number.isFinite(v) ? v : SPAN_LEN_M;
}

// 勾配が入っている先頭からの連続区間の終端。ここまでが目標値を出せる範囲
function firstEmptySlopeSpan() {
  const sl = getSpanSlopes();
  for (let i = 1; i <= SPANS; i++) if (sl[i - 1] === null) return i;
  return 0; // 全部埋まっている
}

// Main Calculation
let memTargets = {}; // Store calculated targets

function runCalc() {
  const corrEl = document.getElementById('val_corr');
  const h = (corrOn && corrEl && corrEl.value !== '') ? parseFloat(corrEl.value) : 0;
  const spanSlopes = getSpanSlopes();

  // Get Readings (NaN if empty)
  const rb = document.getElementById('val_rb').value === '' ? NaN : parseFloat(document.getElementById('val_rb').value);
  const rf = document.getElementById('val_rf').value === '' ? NaN : parseFloat(document.getElementById('val_rf').value);

  // Calculate Points
  memTargets = {}; // Reset memory

  let cumDrop = 0;
  let known = true; // 勾配が途切れたら、それ以降は目標値を出せない
  for(let i=1; i<=SPANS; i++) {
    if (spanSlopes[i-1] === null) known = false;
    if (known) cumDrop += spanLen(i) * 1000 * (spanSlopes[i-1] / 100);

    // Formula: 目標値 = 基準値(奥or手前) - 累積drop + PGF高
    const drop = cumDrop;

    // --- Back Row ---
    const elOutRb = document.getElementById(`out_rb_${i}`);
    if(known && !isNaN(rb)) {
      const val = Math.round(rb - drop + h);
      memTargets[`rb_${i}`] = val;
      elOutRb.innerText = val;
      chkDiff('rb', i);
    } else {
      elOutRb.innerText = '-';
      const dRb = document.getElementById(`diff_rb_${i}`); dRb.innerText = '-'; dRb.style.color = '#6b6b6b';
    }

    // --- Front Row ---
    const elOutRf = document.getElementById(`out_rf_${i}`);
    if(known && !isNaN(rf)) {
      const val = Math.round(rf - drop + h);
      memTargets[`rf_${i}`] = val;
      elOutRf.innerText = val;
      chkDiff('rf', i);
    } else {
      elOutRf.innerText = '-';
      const dRf = document.getElementById(`diff_rf_${i}`); dRf.innerText = '-'; dRf.style.color = '#6b6b6b';
    }
  }

  drawSlope();
  // 勾配計算パネルの表示はグリッドの距離に依存する。距離が変われば追随させる
  onSlopeCalcInput();
}

function chkDiff(type, idx) {
  const key = `${type}_${idx}`;
  const target = memTargets[key];
  const inpEl = document.getElementById(`in_${key}`);
  const outEl = document.getElementById(`diff_${key}`);
  const clearBtn = inpEl?.parentElement?.querySelector('.btn-clear');

  // Toggle clear button visibility
  if(clearBtn) {
    if(inpEl.value !== '') {
      clearBtn.classList.add('show');
    } else {
      clearBtn.classList.remove('show');
    }
  }

  if(target === undefined || inpEl.value === '') {
    outEl.innerText = '-';
    outEl.style.color = '#6b6b6b';
    return;
  }

  const actual = parseFloat(inpEl.value);
  const diff = target - actual;

  // Diff Logic:
  // Target 1000, Actual 900. Diff +100.
  // Actual is smaller -> Ground is higher -> Need to Cut/Lower -> ▼
  // Target 1000, Actual 1100. Diff -100.
  // Actual is bigger -> Ground is lower -> Need to Fill/Raise -> ▲

  if(diff > 0) {
    outEl.innerText = Math.abs(diff) + ' 高い';
    outEl.style.color = '#f44336';
  } else if (diff < 0) {
    outEl.innerText = Math.abs(diff) + ' 低い';
    outEl.style.color = '#2196F3';
  } else {
    outEl.innerText = 'OK';
    outEl.style.color = '#FFD600';
  }
}

function clearInp(id) {
  const el = document.getElementById(id);
  if(el) {
    el.value = '';
    // Trigger input event manually or just call chk
    // id format: in_rb_1
    const parts = id.split('_'); // [in, rb, 1]
    chkDiff(parts[1], parts[2]);
    el.focus();
    // Clear button will be hidden by chkDiff function
  }
}

function drawSlope() {
  const svgEl = document.getElementById('slope-svg');
  if (!svgEl) return;

  const spanSlopes = getSpanSlopes();

  const W = (SPANS + 1) * COL_W, H = 90;
  const pad = COL_W / 2; // 各列の中心に点を置く
  const usableW = W - 2 * pad; // = SPANS * COL_W
  const tickTop = 8, tickBot = 22, arrowY = 15;
  const centerY = 58;

  svgEl.setAttribute('width', W);
  svgEl.setAttribute('height', H);

  // Fixed equal spacing regardless of distance values
  const step = usableW / SPANS; // 100px per span

  // Build points array
  let pts = [];
  let cumYDrop = 0;
  if (!isReversed) {
    pts.push({ x: pad, y: centerY, isRef: true });
    for (let i = 0; i < SPANS; i++) {
      if (spanSlopes[i] === null) break; // 勾配が入っていない先は描かない
      cumYDrop += step * (spanSlopes[i] / 100);
      pts.push({ x: pad + step * (i + 1), y: centerY - cumYDrop, isRef: false });
    }
  } else {
    pts.push({ x: W - pad, y: centerY, isRef: true });
    for (let i = 0; i < SPANS; i++) {
      if (spanSlopes[i] === null) break; // 勾配が入っていない先は描かない
      cumYDrop += step * (spanSlopes[i] / 100);
      pts.push({ x: W - pad - step * (i + 1), y: centerY - cumYDrop, isRef: false });
    }
  }

  // Clamp y to slope area
  const yMin = tickBot + 8, yMax = H - 6;
  pts.forEach(p => { p.y = Math.max(yMin, Math.min(yMax, p.y)); });

  // x positions sorted left to right for dimension arrows
  const xPos = pts.map(p => p.x).sort((a, b) => a - b);

  let svg = '';

  // Dimension arrows
  const aw = 7, ah = 4; // arrowhead width / half-height
  for (let i = 0; i < xPos.length - 1; i++) {
    const x1 = xPos[i], x2 = xPos[i + 1];

    // Tick marks
    svg += `<line x1="${x1.toFixed(1)}" y1="${tickTop}" x2="${x1.toFixed(1)}" y2="${tickBot}" stroke="#9a9a9a" stroke-width="0.5"/>`;
    if (i === xPos.length - 2) {
      svg += `<line x1="${x2.toFixed(1)}" y1="${tickTop}" x2="${x2.toFixed(1)}" y2="${tickBot}" stroke="#9a9a9a" stroke-width="0.5"/>`;
    }

    // Dimension baseline
    if (x2 - x1 > aw * 2) {
      svg += `<line x1="${(x1 + aw).toFixed(1)}" y1="${arrowY}" x2="${(x2 - aw).toFixed(1)}" y2="${arrowY}" stroke="#9a9a9a" stroke-width="0.5"/>`;
    }

    // Arrowheads (inward-pointing)
    svg += `<polygon points="${x1},${arrowY} ${x1+aw},${arrowY-ah} ${x1+aw},${arrowY+ah}" fill="#9a9a9a"/>`;
    svg += `<polygon points="${x2},${arrowY} ${x2-aw},${arrowY-ah} ${x2-aw},${arrowY+ah}" fill="#9a9a9a"/>`;
  }

  // Horizontal reference line (dashed)
  svg += `<line x1="${pad}" y1="${centerY}" x2="${W - pad}" y2="${centerY}" stroke="rgba(255,255,255,0.2)" stroke-width="1" stroke-dasharray="3,3"/>`;

  // Drop lines from each dot to the bottom edge
  for (const p of pts) {
    svg += `<line x1="${p.x.toFixed(1)}" y1="${p.y.toFixed(1)}" x2="${p.x.toFixed(1)}" y2="${H}" stroke="rgba(255,255,255,0.25)" stroke-width="1" stroke-dasharray="4,3"/>`;
  }

  // Slope line
  const lineCoords = pts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  svg += `<polyline points="${lineCoords}" fill="none" stroke="#2196F3" stroke-width="2" stroke-linejoin="round"/>`;

  // Dots
  for (const p of pts) {
    if (p.isRef) {
      svg += `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="5" fill="#f44336" stroke="#000" stroke-width="0.5"/>`;
    } else {
      svg += `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4" fill="#FFD600" stroke="#000" stroke-width="0.5"/>`;
    }
  }

  svgEl.innerHTML = svg;
}

// 引き継ぎを廃止したので「=」は使わない。0% は「水平」という有効な値なので、
// 未入力を 0 と誤解させないよう placeholder は「−」にする。

function doReset() {
  // Clear reading inputs (基準点の読値)
  document.getElementById('val_rb').value = '';
  document.getElementById('val_rf').value = '';
  
  // Clear all reading value inputs (各地点の読値)
  const inputs = document.querySelectorAll('input');
  inputs.forEach(el => {
    if(!el.id.startsWith('val_') && !el.id.startsWith('in_dist_')) { // Reading value inputs
      el.value = '';
    }
  });
  
  // Clear all calculation results and differences
  memTargets = {};
  for(let i=1; i<=SPANS; i++) {
    // Clear back row results
    document.getElementById(`out_rb_${i}`).innerText = '-';
    document.getElementById(`diff_rb_${i}`).innerText = '-';
    // Clear front row results
    document.getElementById(`out_rf_${i}`).innerText = '-';
    document.getElementById(`diff_rf_${i}`).innerText = '-';
    // Hide clear buttons
    chkDiff('rb', i);
    chkDiff('rf', i);
  }
  
  resetSlopeCalc(); // パネルの表示と実データが食い違わないようにする
  // Recalculate to update distance labels based on settings
  runCalc();
}

// --- 勾配計算：レベルの読値2点と測距から勾配(%)を出す ---
//
// 用語：スパン＝PGF製品1本分。測距＝読値Aを取った点と読値Bを取った点の間の距離。別物である。
// 製品は基本 SPAN_LEN_M だが例外があり、その区間はスパンの距離欄を手動で変える運用。
// よって測距も 5 の倍数とは限らない（例：5m と 2.5m の2本を測れば 7.5m）。自由入力とする。
//
// 式は既存の目標値計算  目標値 = 基準読値 − 距離(m) × 1000 × (勾配% ÷ 100)  の逆関数。
// 逆関数として定義しているので符号を人が決めず、取り違えが起こらない。
//
// measuredRange() が「空いている先頭のスパンから、測距が届く範囲」を返す。
// 勾配はその範囲にだけ入れる。引き継ぎはしないので、その先は空欄＝目標値も出ない。
// 次に測って適用すると、空いている先頭（＝今回の続き）から入る。
// 測距が切れ目に一致しない場合は適用させない。どのスパンまでが測れたのか決まらないため。
// その状態は勾配セルの背景（最後の1本が赤）で示す＝距離欄の設定と噛み合っていない印。

// 正の数だけを受け付ける。parseFloat は '1200abc' を 1200、'1.2.3' を 1.2 として通すため使えない
function scNum(id) {
  const el = document.getElementById(id);
  if (!el) return null;
  const v = el.value.trim();
  if (!/^\d+(\.\d+)?$/.test(v)) return null;
  const n = parseFloat(v);
  return n > 0 ? n : null;
}

function calcSlopeFromReadings() {
  const a = scNum('sc_a');
  const b = scNum('sc_b');
  const d = scNum('sc_d');
  if (a === null || b === null || d === null) return null;
  return (a - b) / (d * 1000) * 100;
}

// 勾配計算の適用先を決める。空いている先頭のスパンから、測距が届く範囲を返す。
//   { start, end, exact }   exact=false は測距がスパンの切れ目に一致していない
// 判定には画面のスパン距離（未入力なら SPAN_LEN_M）を使うので、例外区間も反映される。
function measuredRange() {
  const d = scNum('sc_d');
  const start = firstEmptySlopeSpan();
  if (d === null || start === 0) return null;
  let cum = 0;
  for (let i = start; i <= SPANS; i++) {
    cum += spanLen(i);
    if (Math.abs(cum - d) < 0.001) return { start, end: i, exact: true };
    if (cum > d) return { start, end: i, exact: false };
  }
  return { start, end: SPANS, exact: false }; // 測距が残りのスパンより長い
}

// 測距が指す範囲を勾配セルの背景で示す。黄＝収まっている／赤＝最後の半端な1本
function markMeasuredSpans() {
  const boxOf = i => {
    const el = document.getElementById(`val_slope_${i}`);
    return el ? el.closest('.int-slope-inp') : null;
  };
  for (let i = 1; i <= SPANS; i++) {
    boxOf(i)?.classList.remove('mark-ok', 'mark-bad', 'mark-l', 'mark-r');
  }
  const r = measuredRange();
  if (!r) return;
  for (let i = r.start; i <= r.end; i++) {
    boxOf(i)?.classList.add((!r.exact && i === r.end) ? 'mark-bad' : 'mark-ok');
  }
  // 枠の左右は画面上の並びで決める。観測点変更で列の順序が反転するため
  boxOf(isReversed ? r.end : r.start)?.classList.add('mark-l');
  boxOf(isReversed ? r.start : r.end)?.classList.add('mark-r');
}

// 勾配は3桁で丸める。20mでの誤差は最大0.1mmとなり、目標値の整数丸めに埋もれる
function fmtSlope(s) {
  return String(parseFloat(s.toFixed(3)));
}

function toggleSlopeCalc() {
  const panel = document.getElementById('sc-panel');
  const btn = document.getElementById('sc-btn');
  const open = panel.style.display === 'none';
  panel.style.display = open ? 'block' : 'none';
  btn.className = open ? 'btn btn-sc-on' : 'btn btn-sc';
  if (open) {
    onSlopeCalcInput(); // 閉じている間に距離が変わっている可能性があるため 開いた時に最新化
    document.getElementById('sc_a').focus();
  }
}

function onSlopeCalcInput() {
  const out = document.getElementById('sc_out');
  const apply = document.getElementById('sc_apply');
  if (!out || !apply) return;
  markMeasuredSpans();
  const s = calcSlopeFromReadings();
  if (s === null) {
    out.innerText = '読値A・読値B・測距を入れる';
    out.style.color = '#6b6b6b';
    apply.disabled = true;
    return;
  }
  const r = measuredRange();
  if (r === null) {
    out.innerText = '入れる場所がありません（読値リセット）';
    out.style.color = '#f44336';
    apply.disabled = true;
  } else if (r.exact) {
    out.innerText = `勾配 ${fmtSlope(s)} %　（スパン${r.start}〜${r.end}）`;
    out.style.color = '#FFD600';
    apply.disabled = false;
  } else {
    out.innerText = `勾配 ${fmtSlope(s)} %　（切れ目に不一致）`;
    out.style.color = '#f44336';
    apply.disabled = true;
  }
}

// 測った区間にだけ勾配を入れる。引き継ぎはしないので、この先は空欄のまま＝目標値も出ない。
// 次に測って適用すると、空いている先頭（＝今回の続き）から入る。
function applySlopeCalc() {
  const s = calcSlopeFromReadings();
  const r = measuredRange();
  if (s === null || r === null || !r.exact) return;
  const v = fmtSlope(s);
  for (let i = r.start; i <= r.end; i++) {
    const el = document.getElementById(`val_slope_${i}`);
    if (!el) continue;
    el.value = v;
    const clearBtn = el.parentElement?.querySelector('.btn-clear');
    if (clearBtn) clearBtn.classList.add('show');
  }
  updateSlopePlaceholders();
  runCalc();
  resetSlopeCalc(); // 使い終わった値は残さない。次は続きから入る
  toggleSlopeCalc();
}

// 観測点変更・読値リセットの後にパネルを初期化する。
// 残したままだと、測った向きと適用先の意味が黙ってずれる／表示と実データが食い違う
function resetSlopeCalc() {
  ['sc_a', 'sc_b', 'sc_d'].forEach(id => {
    const e = document.getElementById(id);
    if (e) e.value = '';
  });
  onSlopeCalcInput();
}

function doFlip() {
  // Toggle observation direction
  isReversed = !isReversed;
  
  // Save current input values before regenerating grid
  const rbValue = document.getElementById('val_rb')?.value || '';
  const rfValue = document.getElementById('val_rf')?.value || '';
  
  // Save all reading values (back and front rows)
  const readingValues = {};
  for(let i=1; i<=SPANS; i++) {
    const rbReading = document.getElementById(`in_rb_${i}`)?.value || '';
    const rfReading = document.getElementById(`in_rf_${i}`)?.value || '';
    readingValues[`rb_${i}`] = rbReading;
    readingValues[`rf_${i}`] = rfReading;
  }

  // Save distance values
  const distValues = {};
  for(let i=1; i<=SPANS; i++) {
    distValues[i] = document.getElementById(`in_dist_${i}`)?.value || '';
  }

  // Save slope values
  const slopeVals = {};
  for(let i=1; i<=SPANS; i++) {
    slopeVals[i] = document.getElementById(`val_slope_${i}`)?.value || '';
  }

  // Regenerate grid with new layout
  generateGrid();
  
  // Restore input values (swap back and front)
  // Swap reading values: back gets front, front gets back
  if (rfValue) document.getElementById('val_rb').value = rfValue;
  if (rbValue) document.getElementById('val_rf').value = rbValue;
  
  // Restore reading values (swap back and front)
  for(let i=1; i<=SPANS; i++) {
    // Swap: back row gets front values, front row gets back values
    if (readingValues[`rf_${i}`]) {
      document.getElementById(`in_rb_${i}`).value = readingValues[`rf_${i}`];
    }
    if (readingValues[`rb_${i}`]) {
      document.getElementById(`in_rf_${i}`).value = readingValues[`rb_${i}`];
    }
  }
  
  // Restore distance values
  for(let i=1; i<=SPANS; i++) {
    const el = document.getElementById(`in_dist_${i}`);
    if(el) {
      el.value = distValues[i];
      const clearBtn = el.parentElement?.querySelector('.btn-clear');
      if(clearBtn) clearBtn.classList.toggle('show', distValues[i] !== '');
    }
  }

  // Restore slope values
  for(let i=1; i<=SPANS; i++) {
    const slopeEl = document.getElementById(`val_slope_${i}`);
    if(slopeEl && slopeVals[i] !== '') {
      slopeEl.value = slopeVals[i];
      const clearBtn = slopeEl.parentElement?.querySelector('.btn-clear');
      if(clearBtn) clearBtn.classList.add('show');
    }
  }

  // Recalculate with new layout
  runCalc();
  
  resetSlopeCalc(); // 向きが変わると測った向きと適用先の意味がずれるため初期化する

  // Recalculate differences for all restored reading values
  for(let i=1; i<=SPANS; i++) {
    if (readingValues[`rf_${i}`]) {
      chkDiff('rb', i);
    }
    if (readingValues[`rb_${i}`]) {
      chkDiff('rf', i);
    }
  }
}
